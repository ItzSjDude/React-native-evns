apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"
apply plugin: "com.google.firebase.crashlytics"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * R8 minify + resource shrinking for release builds. DEFAULT OFF: the keep rules in proguard-rules.pro are
 * build-verified but NOT runtime-verified on a device, so only turn this on for a release candidate you will
 * smoke-test (LiveKit join, Razorpay checkout, FCM, AdMob, Play Billing, fast-image).
 *   ./gradlew :app:assembleRelease -PhivaMinify=true        (or env HIVA_MINIFY=true)
 */
def hivaFlag = { String prop, String env ->
    (project.findProperty(prop) ?: System.getenv(env) ?: 'false').toString().trim().toLowerCase() == 'true'
}
def enableProguardInReleaseBuilds = hivaFlag('hivaMinify', 'HIVA_MINIFY')

/**
 * When true, producing a release artifact (assembleRelease/bundleRelease/packageRelease) FAILS unless
 * android/keystore.properties exists and is complete, instead of silently signing with the debug key.
 * Off locally; on in the CI release workflow.
 *   ./gradlew :app:bundleRelease -PhivaRequireReleaseKey=true   (or env HIVA_REQUIRE_RELEASE_KEY=true)
 */
def requireReleaseKey = hivaFlag('hivaRequireReleaseKey', 'HIVA_REQUIRE_RELEASE_KEY')

def hivaLinkHost = (System.getenv('HIVA_LINK_HOST') ?: project.findProperty('HIVA_LINK_HOST') ?: 'links.invalid').trim().toLowerCase()
if (!(hivaLinkHost ==~ /(?=.{1,253}$)(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}/)) {
    throw new GradleException('HIVA_LINK_HOST must be a bare DNS hostname (no scheme, port, path, query, or wildcard).')
}

def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.hivachat.app"
    defaultConfig {
        applicationId "com.hivachat.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Play Store rejects an upload whose versionCode isn't higher than the last one, so bump it per release:
        //   HIVA_VERSION_CODE=2 HIVA_VERSION_NAME=1.0.1 ./gradlew bundleRelease
        versionCode = Integer.parseInt(System.getenv('HIVA_VERSION_CODE') ?: '1')
        versionName = System.getenv('HIVA_VERSION_NAME') ?: '1.0.0'
        manifestPlaceholders.hivaLinkHost = hivaLinkHost
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // android/keystore.properties (git-ignored) points at the real upload key; see keystore.properties.example.
        if (keystorePropertiesFile.exists()) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Falls back to the debug key when no keystore.properties exists, so local release builds still work
            // but are NOT uploadable to the Play Store.
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                logger.warn('WARNING: android/keystore.properties not found; signing the release build with the DEBUG key.')
                signingConfig signingConfigs.debug
            }
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

// Fail (not warn) when a Play-bound release is requested without a real upload key. Checked at task-graph time so
// debug builds, `clean`, lint, etc. keep working even with the flag on.
gradle.taskGraph.whenReady { graph ->
    if (!requireReleaseKey) return
    def producesRelease = graph.allTasks.any {
        it.project == project && it.name ==~ /(assemble|bundle|package|sign|validateSigning).*Release.*/
    }
    if (!producesRelease) return
    def missing = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].findAll {
        !(keystoreProperties[it] ?: '').toString().trim()
    }
    if (!keystorePropertiesFile.exists()) {
        throw new GradleException("hivaRequireReleaseKey is set but ${keystorePropertiesFile} does not exist. " +
            'Refusing to build a release signed with the debug key. See android/keystore.properties.example.')
    }
    if (missing) {
        throw new GradleException("hivaRequireReleaseKey is set but keystore.properties is missing values for: ${missing.join(', ')}")
    }
    if (!file(keystoreProperties['storeFile']).exists()) {
        throw new GradleException("hivaRequireReleaseKey is set but storeFile does not exist: ${file(keystoreProperties['storeFile'])}")
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // react-native-image-picker: with minSdk < 30, activity >= 1.9 enables the
    // backported AndroidX Photo Picker (Android 11-12 via Play services).
    implementation("androidx.activity:activity:1.9.3")
    implementation("com.google.android.gms:play-services-location:21.4.0")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
