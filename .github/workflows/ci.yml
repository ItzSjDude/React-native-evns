name: CI

on:
  push:
    branches: [staging, main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # ios/Pods is git-ignored (so absent in CI) but present on dev machines and contains a minified vendor .js
      # that eslint cannot parse; ignore it so the same command passes locally. Warnings are pre-existing, errors fail.
      - run: npx eslint . --ignore-pattern 'ios/Pods/**'
      - run: npm test -- --ci
